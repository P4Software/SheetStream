# OpenSSF Scorecard: an automated review of the repository's security practices (pinned dependencies,
# branch protection, token permissions, dependency updates, SAST...). Results are published to
# https://scorecard.dev/viewer/?uri=github.com/P4Software/SheetStream and shown as a README badge, so
# anyone evaluating SheetStream for production can see the score without trusting our word for it.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'   # Weekly, so the score reflects new checks even when the code does not change.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # publish the results to the Scorecard API (needed for the badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
