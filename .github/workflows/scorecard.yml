# OpenSSF Scorecard: an automated review of the repository's security practices (pinned dependencies,
# branch protection, token permissions, dependency updates, SAST...). Results are published to
# https://scorecard.dev/viewer/?uri=github.com/P4Software/SheetStream.NET and shown as a README badge, so
# anyone evaluating SheetStream for production can see the score without trusting our word for it.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'   # Weekly, so the score reflects new checks even when the code does not change.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # publish the results to the Scorecard API (needed for the badge)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: results.sarif
