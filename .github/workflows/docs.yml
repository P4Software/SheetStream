# Builds the documentation site (guides plus API reference generated from the XML doc comments) and
# publishes it to GitHub Pages on every push to main.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      # The coverage badge in the README reads docs/_site/coverage.json through shields.io's endpoint
      # badge. Serving it from the docs site keeps the number honest (it comes from a real test run on
      # main) without a third-party coverage service or a stored token.
      - name: Test with coverage
        run: dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Write coverage badge data
        run: |
          python3 - <<'PY'
          import glob, json, xml.etree.ElementTree as ET
          rate = max(float(ET.parse(f).getroot().get("line-rate")) for f in glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)) * 100
          color = "brightgreen" if rate >= 90 else "green" if rate >= 80 else "yellow" if rate >= 70 else "orange"
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{rate:.1f}%", "color": color}, open("docs/_site/coverage.json", "w"))
          print(f"line coverage {rate:.1f}%")
          PY

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the site
      id-token: write   # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
