# Publishes SheetStream to nuget.org when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# The tag must match the <Version> in src/SheetStream/SheetStream.csproj; the build job fails early if it
# does not, so a stale csproj version can never ship under the wrong tag.
#
# Publishing uses nuget.org Trusted Publishing: a policy on the P4Software nuget.org account trusts this
# repository's release.yml, so the publish job exchanges its GitHub OIDC token for a short-lived API key.
# No long-lived key is stored anywhere.
#
# The work is split into four jobs so each holds only the permission it needs: building and testing run
# our own and third-party code with a read-only token; the attest job alone can sign provenance, only the publish job can mint a NuGet key,
# and only the release job can write to the repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # this job runs third-party test code, so it never holds a signing token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches both package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for P in src/SheetStream/SheetStream.csproj src/SheetStream.AspNetCore/SheetStream.AspNetCore.csproj; do
            V=$(grep -oPm1 '(?<=<Version>)[^<]+' "$P")
            echo "tag=$TAG $P=$V"
            test "$TAG" = "$V" || { echo "Tag v$TAG does not match <Version>$V</Version> in $P; bump it first."; exit 1; }
          done

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --no-build -c Release
      - name: Pack
        run: |
          dotnet pack src/SheetStream/SheetStream.csproj --no-build -c Release -o artifacts
          dotnet pack src/SheetStream.AspNetCore/SheetStream.AspNetCore.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-packages
          path: artifacts/*

  # Runs after the build with nothing but the finished packages: no project code or tests execute here,
  # so the signing token cannot be reached by anything a dependency might run.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation on GitHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-packages
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # A software bill of materials (SPDX 2.2) listing exactly what is inside the packages and what they
      # were built from, attached to every release so procurement and security teams can check it.
      # The tool version is pinned so the SBOM format cannot change under us.
      - name: Generate SBOM
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13
          sbom-tool generate -b artifacts -bc . -m sbom -pn SheetStream -pv "${GITHUB_REF_NAME#v}" -ps "P4 Software" -nsb https://p4.software/sbom -V Warning
          cp sbom/_manifest/spdx_2.2/manifest.spdx.json "artifacts/SheetStream-${GITHUB_REF_NAME#v}.spdx.json"

      # Signed statement that these exact package files were produced by this workflow from this commit.
      # Anyone can verify it with `gh attestation verify SheetStream.x.y.z.nupkg --owner P4Software`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/*.nupkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: artifacts/*

  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # request the OIDC token NuGet exchanges for a short-lived key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # Official NuGet action, pinned to the v1.2.0 commit so a moved tag cannot change what runs.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: P4Software

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: artifacts

      # The runner's built-in gh CLI avoids a third-party action holding a contents:write token.
      - name: Create GitHub release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
