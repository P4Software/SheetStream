name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      # Includes the schema-validation, template, async, ASP.NET Core and reader fuzz tests.
      - name: Test with coverage
        run: dotnet test --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          root = ET.parse(files[0]).getroot()
          print("## Code coverage")
          print(f"Line coverage: **{float(root.get('line-rate')) * 100:.1f}%**, branch coverage: **{float(root.get('branch-rate')) * 100:.1f}%**")
          print()
          print("| Package | Lines |")
          print("|---|---|")
          for p in root.iter("package"):
              print(f"| {p.get('name')} | {float(p.get('line-rate')) * 100:.1f}% |")
          PY
      - name: Pack
        run: |
          dotnet pack src/SheetStream/SheetStream.csproj --no-build -c Release -o artifacts
          dotnet pack src/SheetStream.AspNetCore/SheetStream.AspNetCore.csproj --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
